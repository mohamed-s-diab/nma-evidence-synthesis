<svg width="900" height="320" viewBox="0 0 900 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Apple Light Background Gradient -->
    <linearGradient id="bgGradApple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F5F5F7" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="cardShadow" x="-10" y="-10" width="920" height="340" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.06" />
    </filter>

    <!-- Pill Background Gradient -->
    <linearGradient id="pillBgLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FAFAFC" />
    </linearGradient>
  </defs>

  <!-- Container Box with Apple Rounded Corners -->
  <rect x="3" y="3" width="894" height="314" rx="20" fill="url(#bgGradApple)" stroke="#E5E5EA" stroke-width="1.5" />

  <!-- macOS Window Chrome Dots -->
  <circle cx="36" cy="32" r="6" fill="#FF5F56" />
  <circle cx="56" cy="32" r="6" fill="#FFBD2E" />
  <circle cx="76" cy="32" r="6" fill="#27C93F" />

  <!-- Window Header Label -->
  <text x="105" y="36" fill="#86868B" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="500" letter-spacing="0.3">r-netmeta // evidence-synthesis-workflow</text>

  <!-- Top Divider Line -->
  <line x1="3" y1="56" x2="897" y2="56" stroke="#E5E5EA" stroke-width="1" />

  <!-- Eyebrow Category Tag Badge -->
  <g transform="translate(40, 78)">
    <rect width="280" height="26" rx="13" fill="#E8F2FF" stroke="#CCE0FF" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#0071E3"/>
    <text x="26" y="17" fill="#0071E3" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">REPRODUCIBLE R WORKFLOW · NETMETA</text>
  </g>

  <!-- Main Headline -->
  <text x="40" y="150" fill="#1D1D1F" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', 'Inter', sans-serif" font-size="34" font-weight="800" letter-spacing="-0.8">Network Meta-Analysis in R</text>

  <!-- Subtitle -->
  <text x="40" y="184" fill="#6E6E73" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="15" font-weight="400" letter-spacing="-0.2">A Modular Evidence Synthesis Framework using Simulated Benchmark Data</text>

  <!-- Apple Pills Row -->
  <!-- Pill 1: 12 R Scripts -->
  <g transform="translate(40, 226)">
    <rect width="186" height="46" rx="10" fill="url(#pillBgLight)" stroke="#E5E5EA" stroke-width="1" />
    <text x="16" y="28" fill="#0071E3" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="700">⚡ 12 R Scripts</text>
    <text x="110" y="28" fill="#6E6E73" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="400">Modular</text>
  </g>

  <!-- Pill 2: Synthetic Data -->
  <g transform="translate(242, 226)">
    <rect width="206" height="46" rx="10" fill="url(#pillBgLight)" stroke="#E5E5EA" stroke-width="1" />
    <text x="16" y="28" fill="#F0883E" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="700">📊 Synthetic Data</text>
    <text x="126" y="28" fill="#6E6E73" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="400">Benchmark</text>
  </g>

  <!-- Pill 3: 14 Exhibits -->
  <g transform="translate(464, 226)">
    <rect width="186" height="46" rx="10" fill="url(#pillBgLight)" stroke="#E5E5EA" stroke-width="1" />
    <text x="16" y="28" fill="#34C759" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="700">🎯 14 Exhibits</text>
    <text x="108" y="28" fill="#6E6E73" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="400">Visuals</text>
  </g>

  <!-- Pill 4: renv Environment -->
  <g transform="translate(666, 226)">
    <rect width="194" height="46" rx="10" fill="url(#pillBgLight)" stroke="#E5E5EA" stroke-width="1" />
    <text x="16" y="28" fill="#AF52DE" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="700">🔒 renv Locked</text>
    <text x="112" y="28" fill="#6E6E73" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="400">Pipeline</text>
  </g>
</svg>
